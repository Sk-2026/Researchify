
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: researchify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: researchify
      POSTGRES_USER: researchify
      POSTGRES_PASSWORD: researchify_dev_password
    ports:
      - "5432:5432"
    volumes:
      - researchify_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/001-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchify -d researchify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  researchify_postgres_data:
